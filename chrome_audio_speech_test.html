<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrome Audio & Speech Recognition QA Test</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            width: 100%;
            max-width: 680px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .header {
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.4rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .badge {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 0.5rem;
        }
        .badge-pending { background: #334155; color: #cbd5e1; }
        .badge-active { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
        .badge-error { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }

        .section {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.2rem;
            margin-bottom: 1.2rem;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* VU Meter */
        .vu-container {
            width: 100%;
            height: 18px;
            background: #090d16;
            border-radius: 9px;
            overflow: hidden;
            border: 1px solid var(--border);
            position: relative;
        }

        .vu-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #10b981 0%, #10b981 70%, #f59e0b 85%, #ef4444 100%);
            transition: width 0.08s ease-out;
        }

        .vu-peak-value {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.4rem;
            text-align: right;
        }

        /* Transcripción */
        .transcript-box {
            min-height: 90px;
            max-height: 140px;
            overflow-y: auto;
            background: #090d16;
            border-radius: 8px;
            padding: 0.8rem;
            border: 1px solid var(--border);
            font-size: 0.95rem;
            line-height: 1.4;
            color: #e2e8f0;
        }
        .transcript-box .interim {
            color: #94a3b8;
            font-style: italic;
        }

        /* Eventos log */
        .log-box {
            font-family: monospace;
            font-size: 0.78rem;
            color: #94a3b8;
            max-height: 100px;
            overflow-y: auto;
            background: #090d16;
            padding: 0.6rem;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .log-entry { margin-bottom: 0.2rem; }
        .log-entry.ok { color: #34d399; }
        .log-entry.warn { color: #fbbf24; }
        .log-entry.err { color: #f87171; }

        .btn-row {
            display: flex;
            gap: 0.8rem;
            justify-content: flex-end;
            margin-top: 1rem;
        }

        button {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: var(--accent-hover); }
        button.secondary { background: #334155; color: #cbd5e1; }
        button.secondary:hover { background: #475569; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h1>Google Chrome Audio & Speech QA</h1>
        <p>Validador de entrada ALSA y Reconocimiento de Voz</p>
        <span id="statusBadge" class="badge badge-pending">Inicializando...</span>
    </div>

    <!-- Nivel de Audio / VU-Meter -->
    <div class="section">
        <div class="section-title">
            <span>Nivel de Entrada de Micrófono (RMS)</span>
            <span id="audioLevelPct">0%</span>
        </div>
        <div class="vu-container">
            <div id="vuBar" class="vu-bar"></div>
        </div>
        <div class="vu-peak-value">
            Pico Máximo: <b id="maxRms">0%</b> | Muestras > 5%: <b id="activityCount">0</b>
        </div>
    </div>

    <!-- Reconocimiento de Voz -->
    <div class="section">
        <div class="section-title">
            <span>Reconocimiento de Voz (Web Speech API - es-ES)</span>
            <span id="speechState">Esperando voz...</span>
        </div>
        <div id="transcriptBox" class="transcript-box">
            <span id="finalTranscript"></span><span id="interimTranscript" class="interim"></span>
        </div>
        <div style="margin-top: 0.6rem; display: flex; justify-content: flex-end;">
            <button id="btnForceSpeech" class="secondary" style="font-size: 0.8rem; padding: 0.3rem 0.8rem;" onclick="forceRestartSpeech()">🎤 Forzar Reconocimiento</button>
        </div>
    </div>

    <!-- Registro de Diagnóstico -->
    <div class="section">
        <div class="section-title">Registro de Eventos y Diagnóstico</div>
        <div id="logBox" class="log-box"></div>
    </div>

    <div class="btn-row">
        <button class="secondary" onclick="resetMetrics()">Reiniciar Métricas</button>
        <button onclick="sendReportToPython()">Finalizar y Reportar</button>
    </div>
</div>

<script>
    let audioContext = null;
    let analyser = null;
    let microphone = null;
    let recognition = null;

    let maxAudioLevel = 0;
    let audioAboveThresholdCount = 0;
    let finalTranscribedText = "";
    let speechDetected = false;
    let lastError = null;

    function logMsg(msg, type = "info") {
        const logBox = document.getElementById("logBox");
        const entry = document.createElement("div");
        entry.className = `log-entry ${type}`;
        const time = new Date().toISOString().split("T")[1].slice(0, 8);
        entry.textContent = `[${time}] ${msg}`;
        logBox.appendChild(entry);
        logBox.scrollTop = logBox.scrollHeight;
    }

    function updateStatus(text, badgeClass) {
        const badge = document.getElementById("statusBadge");
        badge.textContent = text;
        badge.className = `badge ${badgeClass}`;
    }

    // Inicializar Web Audio API para medir volumen del micrófono ALSA
    async function initAudioCapture() {
        try {
            logMsg("Solicitando acceso a getUserMedia (audio)...");
            const stream = await navigator.mediaDevices.getUserMedia({
                audio: {
                    echoCancellation: false,
                    noiseSuppression: false,
                    autoGainControl: false
                }
            });

            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            if (audioContext.state === "suspended") {
                await audioContext.resume();
            }
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = 0.2;
            microphone = audioContext.createMediaStreamSource(stream);
            microphone.connect(analyser);
            setupVoiceActivityRecorder(stream);

            logMsg(`AudioContext activo (${audioContext.sampleRate}Hz).`, "ok");
            updateStatus("Capturando Audio", "badge-active");

            processAudioLevels();
        } catch (err) {
            lastError = err.message;
            logMsg(`Error al abrir micrófono: ${err.name} - ${err.message}`, "err");
            updateStatus("Error de Micrófono", "badge-error");
            postEventToPython("audio_error", { error: err.name, message: err.message });
        }
    }

    function processAudioLevels() {
        if (!analyser) return;

        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteTimeDomainData(dataArray);

        // Calcular RMS
        let sumSquares = 0.0;
        for (let i = 0; i < dataArray.length; i++) {
            const norm = (dataArray[i] - 128) / 128.0;
            sumSquares += norm * norm;
        }
        const rms = Math.sqrt(sumSquares / dataArray.length);
        const levelPct = Math.min(100, Math.round(rms * 300)); // Escala sensible

        if (levelPct > maxAudioLevel) {
            maxAudioLevel = levelPct;
            document.getElementById("maxRms").textContent = `${maxAudioLevel}%`;
        }

        if (levelPct > 8) {
            audioAboveThresholdCount++;
            document.getElementById("activityCount").textContent = audioAboveThresholdCount;

            // Detección de voz activa para MediaRecorder
            if (!isSpeaking && mediaRecorder && mediaRecorder.state === "inactive") {
                isSpeaking = true;
                mediaRecorder.start();
            }
            if (silenceTimer) clearTimeout(silenceTimer);
            silenceTimer = setTimeout(() => {
                isSpeaking = false;
                if (mediaRecorder && mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                }
            }, 1200);
        }

        document.getElementById("vuBar").style.width = `${levelPct}%`;
        document.getElementById("audioLevelPct").textContent = `${levelPct}%`;

        requestAnimationFrame(processAudioLevels);
    }

    // Inicializar Web Speech Recognition
    function initSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            logMsg("Web Speech Recognition no soportado en este navegador.", "err");
            document.getElementById("speechState").textContent = "No soportado";
            return;
        }

        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = "es-ES";

        recognition.onstart = () => {
            logMsg("Motor de reconocimiento de voz iniciado (es-ES).", "ok");
            document.getElementById("speechState").textContent = "Escuchando...";
            postEventToPython("speech_started", {});
        };

        recognition.onresult = (event) => {
            let interim = "";
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscribedText += event.results[i][0].transcript + " ";
                    speechDetected = true;
                    logMsg(`Transcripción final: "${event.results[i][0].transcript}"`, "ok");
                    postEventToPython("speech_result", {
                        transcript: event.results[i][0].transcript,
                        confidence: event.results[i][0].confidence,
                        is_final: true
                    });
                } else {
                    interim += event.results[i][0].transcript;
                }
            }
            document.getElementById("finalTranscript").textContent = finalTranscribedText;
            document.getElementById("interimTranscript").textContent = interim;
        };

        recognition.onerror = (event) => {
            logMsg(`Evento de reconocimiento: ${event.error}`, event.error === "no-speech" ? "warn" : "err");
            postEventToPython("speech_error", { error: event.error });
            if (event.error === "not-allowed" || event.error === "service-not-allowed") {
                updateStatus("Permiso de Voz Denegado", "badge-error");
            }
        };

        recognition.onend = () => {
            logMsg("Reconocimiento en pausa/finalizado. Reiniciando sesión...", "warn");
            setTimeout(() => {
                try {
                    recognition.start();
                } catch (e) {}
            }, 300);
        };

        try {
            recognition.start();
        } catch (e) {
            logMsg(`Error al iniciar recognition: ${e.message}`, "err");
        }
    }

    function forceRestartSpeech() {
        if (recognition) {
            try { recognition.abort(); } catch (e) {}
        }
        initSpeechRecognition();
        logMsg("Reinicio forzado del reconocimiento de voz solicitado por el usuario.", "ok");
    }

    function postEventToPython(eventType, data) {
        fetch("/api/event", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                event: eventType,
                timestamp: Date.now(),
                ...data
            })
        }).catch(() => {});
    }

    function sendReportToPython() {
        const report = {
            max_audio_level: maxAudioLevel,
            activity_count: audioAboveThresholdCount,
            transcript: finalTranscribedText.trim(),
            speech_detected: speechDetected,
            last_error: lastError
        };

        fetch("/api/complete", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(report)
        }).then(() => {
            logMsg("Reporte enviado al servicio Python. Puedes cerrar esta ventana.", "ok");
            updateStatus("Completado", "badge-active");
        }).catch(err => {
            logMsg(`Error al enviar reporte: ${err.message}`, "err");
        });
    }

    function resetMetrics() {
        maxAudioLevel = 0;
        audioAboveThresholdCount = 0;
        finalTranscribedText = "";
        document.getElementById("maxRms").textContent = "0%";
        document.getElementById("activityCount").textContent = "0";
        document.getElementById("finalTranscript").textContent = "";
        document.getElementById("interimTranscript").textContent = "";
        logMsg("Métricas reiniciadas.");
    }

    // =========================================================================
    // Grabador de buffers de voz para transcripción
    // =========================================================================
    let mediaRecorder = null;
    let audioChunks = [];
    let isSpeaking = false;
    let silenceTimer = null;

    function setupVoiceActivityRecorder(stream) {
        try {
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.ondataavailable = (e) => {
                if (e.data && e.data.size > 0) {
                    audioChunks.push(e.data);
                }
            };
            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                audioChunks = [];
                if (audioBlob.size > 2000) {
                    logMsg(`Voz capturada (${(audioBlob.size/1024).toFixed(1)} KB). Procesando...`, "ok");
                    // Enviar al servicio Python para registro o procesamiento
                    sendAudioBlobToPython(audioBlob);
                }
            };
        } catch (e) {
            logMsg(`MediaRecorder no disponible: ${e.message}`, "warn");
        }
    }

    function sendAudioBlobToPython(blob) {
        fetch("/api/audio_chunk", {
            method: "POST",
            body: blob
        }).then(r => r.json()).then(data => {
            if (data && data.transcript) {
                finalTranscribedText += data.transcript + " ";
                speechDetected = true;
                document.getElementById("finalTranscript").textContent = finalTranscribedText;
                logMsg(`Transcripción ASR: "${data.transcript}"`, "ok");
            }
        }).catch(() => {});
    }

    // Auto-arranque
    window.addEventListener("DOMContentLoaded", () => {
        initAudioCapture();
        initSpeechRecognition();

        // Enviar telemetría periódica a Python
        setInterval(() => {
            postEventToPython("telemetry", {
                max_level: maxAudioLevel,
                activity: audioAboveThresholdCount,
                transcript_len: finalTranscribedText.length
            });
        }, 1500);
    });
</script>
</body>
</html>
